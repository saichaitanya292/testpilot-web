name: Run Playwright browser tests

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public website URL to test
        required: true
        type: string
        default: "https://saichaitanya292.github.io/india-job-alert-media/"

permissions:
  contents: read

concurrency:
  group: playwright-browser-tests
  cancel-in-progress: false

jobs:
  browser-tests:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out test code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate target URL
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          node -e "const u=new URL(process.env.TARGET_URL); if(!['http:','https:'].includes(u.protocol)) throw new Error('Only http/https URLs are allowed'); if(['localhost','127.0.0.1','::1'].includes(u.hostname)) throw new Error('Local URLs are not allowed'); console.log('Target:', u.origin + u.pathname);"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        env:
          BASE_URL: ${{ inputs.target_url }}
        run: npm test

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testpilot-playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
